# Add under `widgets:` in ~/.config/yasb/config.yaml, then add `sysmon` to a bar's widget list
# (e.g. under `right:`) and run `yasbc reload`.
# Replace C:\path\to with the folder that contains SysWatch.exe. If the path contains spaces,
# quote it inside the string: run_cmd: '"C:\Program Files\SysWatch\SysWatch.exe" --widget'
#
# Optional, in styles.css:   .sysmon:hover { background-color: var(--yasb-white-alpha-08); }
  sysmon:
    type: yasb.custom.CustomWidget
    options:
      label: "{data[html]}"
      label_alt: "{data[html_alt]}"
      class_name: sysmon
      tooltip: true
      tooltip_label: "{data[tip]}"
      exec_options:
        run_cmd: 'C:\path\to\SysWatch.exe --widget'
        run_interval: 5000
        return_format: json
        use_shell: false
        encoding: utf-8
      callbacks:
        on_left: 'exec C:\path\to\SysWatch.exe --toggle-snooze'
        on_middle: 'exec taskmgr.exe'
        on_right: toggle_label
